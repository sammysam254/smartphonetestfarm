# =============================================================================
# Protean Provider — Configuration
# All values can be overridden with environment variables.
# Pattern: PROVIDER_<SECTION>_<KEY> in UPPER_SNAKE_CASE
# Example: PROVIDER_COORDINATOR_ADDRESS=coordinator:9000
# =============================================================================

provider:
  name: "lab-provider-01"
  host: "provider-host.local"
  # Pin the advertised IP when the coordinator runs on the same PC: leaving
  # this empty auto-detects the default-route adapter, which can pick a VPN/
  # Tailscale address and break the coordinator→provider and stream proxy hops.
  ip: "127.0.0.1"
  min_port: 7400
  max_port: 7700

coordinator:
  address: "127.0.0.1:9000"
  tls:
    enabled: false           # set true in production; requires certs below
    ca_cert:     "/etc/stf/certs/ca.crt"
    client_cert: "/etc/stf/certs/provider.crt"
    client_key:  "/etc/stf/certs/provider.key"
  heartbeat_interval:    "10s"
  reconnect_max_backoff: "2m"
  call_timeout:          "5s"

adb:
  host:             "127.0.0.1"
  port:             5037
  property_timeout: "5s"
  poll_interval:    "2s"

stream:
  type:         "mjpeg"
  quality:      80
  max_fps:      30
  max_restarts: 3

# On-device FlexPulse agent: installs assets/flexpulse-agent.apk, runs a
# background service and an accessibility service (used for advanced
# automation like app-aware recording and the file explorer).
# false = phone stays untouched (no sideloaded app, no accessibility service);
# screen streaming, touch/keyboard input and audio still work via scrcpy.
# Recommended: keep false when running third-party survey apps whose
# anti-fraud checks may flag accessibility services or unknown packages.
agent:
  enabled: false

metrics:
  enabled: true
  port:    9090
  path:    "/metrics"

grpc_server:
  port:    9091
  enabled: true

logging:
  level:  "debug"   # use "info" in production
  format: "text"    # use "json" in production
